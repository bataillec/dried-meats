name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: mise run setup
      - run: mise run check
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          # Read by app/build.gradle.kts signingConfigs (to be wired in the first build step).
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: mise run release
      - uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
