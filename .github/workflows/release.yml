name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: mise run setup
      - run: mise run check
      - name: Restore keystore
        # Without the secrets (forks, or before the keystore exists) the build falls back to an unsigned APK.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore restored: the release APK will be signed."
          else
            echo "::warning::KEYSTORE_BASE64 is not set: the release APK will be UNSIGNED and cannot be installed."
          fi
      - name: Build release APK
        env:
          # Read by app/build.gradle.kts signingConfigs. RELEASE_KEYSTORE_PATH is only set when the keystore was restored.
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: mise run release
      - name: Verify signature and name the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          cd app/build/outputs/apk/release
          if [ -n "$RELEASE_KEYSTORE_PATH" ]; then
            "$BT/apksigner" verify --verbose app-release.apk
            cp app-release.apk "meat-me-later-${GITHUB_REF_NAME}.apk"
          else
            cp app-release-unsigned.apk "meat-me-later-${GITHUB_REF_NAME}-unsigned.apk"
          fi
          ls -l
      - uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/meat-me-later-*.apk
          generate_release_notes: true
